plugins {
    id "com.android.application"
}

android {
    namespace "com.aditya.aahar"
    compileSdk 35

    defaultConfig {
        applicationId "com.aditya.aahar"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
